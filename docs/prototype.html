<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Firon Performance — iPhone 17 Pro Max Prototype</title>
<style>
  :root{
    --accent:#c7ff3f;        /* energetic lime */
    --accent-2:#7cf5c4;
    --bg:#0b0f0d;
    --surface:#14191b;
    --surface-2:#1c2327;
    --surface-3:#242c31;
    --text:#f2f6f4;
    --muted:#8c9a95;
    --line:#242c2e;
    --danger:#ff6b6b;
    --radius:18px;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2b1f 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 20%, #12242a 0%, transparent 50%),
      #05070a;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 16px;
    color:var(--text);
  }

  /* ===== Stage layout ===== */
  .stage{display:flex;flex-direction:column;align-items:center;gap:20px}
  .stage-title{text-align:center;color:#e9f6ee}
  .stage-title h1{font-size:20px;letter-spacing:.2px;font-weight:700}
  .stage-title p{color:#7f8f89;font-size:13px;margin-top:4px}
  .stage-title .pill{display:inline-block;margin-top:10px;font-size:11px;color:#0b0f0d;background:var(--accent);padding:4px 10px;border-radius:999px;font-weight:700}

  /* ===== iPhone 17 Pro Max ===== */
  .device{
    --w:440px;
    --h:952px;
    position:relative;
    width:var(--w);
    height:var(--h);
    border-radius:66px;
    background:linear-gradient(150deg,#3a3f42,#0d0f10 45%,#2a2f31 100%);
    padding:5px;
    box-shadow:
      0 0 0 2px #05070a,
      0 40px 90px -20px rgba(0,0,0,.85),
      inset 0 0 3px rgba(255,255,255,.25);
  }
  .device::before{ /* titanium rail highlight */
    content:"";position:absolute;inset:2px;border-radius:63px;
    padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 30%,transparent 70%,rgba(255,255,255,.18));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  /* side buttons */
  .btn-side{position:absolute;background:linear-gradient(#2a2f31,#15181a);border-radius:3px}
  .btn-side.action{left:-3px;top:150px;width:4px;height:34px}
  .btn-side.vol-up{left:-3px;top:210px;width:4px;height:60px}
  .btn-side.vol-dn{left:-3px;top:288px;width:4px;height:60px}
  .btn-side.power{right:-3px;top:230px;width:4px;height:96px}

  .bezel{
    position:relative;width:100%;height:100%;
    border-radius:61px;background:#000;overflow:hidden;
  }

  .viewport{
    position:absolute;inset:0;border-radius:61px;overflow:hidden;
    background:var(--bg);display:flex;flex-direction:column;
  }

  /* Dynamic Island */
  .island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:126px;height:35px;background:#000;border-radius:20px;z-index:60;
    display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:12px;
  }
  .island .cam{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#243b52,#000 70%);box-shadow:inset 0 0 2px #4a6b8a}

  /* Status bar */
  .statusbar{
    height:54px;flex:0 0 54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 30px 8px;font-size:15px;font-weight:600;z-index:40;position:relative;color:var(--text);
  }
  .statusbar .icons{display:flex;align-items:center;gap:7px}
  .statusbar svg{display:block}

  /* App body */
  .app{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .screens{flex:1;position:relative;overflow:hidden}
  .screen{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:6px 20px 26px;opacity:0;visibility:hidden;transform:translateX(14px);
    transition:opacity .28s ease,transform .28s ease;
    -webkit-overflow-scrolling:touch;
  }
  .screen::-webkit-scrollbar{width:0}
  .screen.active{opacity:1;visibility:visible;transform:none}

  /* sticky screen header (title + filters + segmented tabs) */
  .sticky-head{
    position:sticky;top:0;z-index:30;
    margin:-6px -20px 0;padding:6px 20px 12px;
    background:var(--bg);
    box-shadow:0 10px 16px -12px rgba(0,0,0,.9);
  }
  .sticky-head::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line);opacity:.7}

  /* Home indicator */
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);z-index:55}

  /* ===== Typography / components ===== */
  h2.screen-title{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;gap:12px}
  .between{justify-content:space-between}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .accent{color:var(--accent)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;transition:.15s}
  .chip.active{background:var(--accent);color:#0b0f0d;border-color:var(--accent);font-weight:700}
  .chip-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px}
  .chip-scroll::-webkit-scrollbar{display:none}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:15px;border:none;background:var(--accent);color:#0b0f0d;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,107,107,.4)}

  .field{margin-top:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:600}
  .input{width:100%;padding:15px 14px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:15px;outline:none;transition:.15s}
  .input:focus{border-color:var(--accent)}
  input[type=time]{color-scheme:dark}
  .input.err{border-color:var(--danger)}
  .err-msg{color:var(--danger);font-size:12px;margin-top:6px;display:none}
  .err-msg.show{display:block}

  .avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0b0f0d;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}

  .thumb{border-radius:14px;position:relative;overflow:hidden;background:#20272b;display:flex;align-items:flex-end;color:#fff}
  .thumb .grad{position:absolute;inset:0}
  .thumb .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:7px;font-size:11px;font-weight:600;z-index:2}
  .thumb .fav{position:absolute;top:8px;right:8px;z-index:2;cursor:pointer;font-size:16px;background:rgba(0,0,0,.4);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .thumb .play span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);color:#0b0f0d;display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:3px}
  .progressbar{position:absolute;bottom:0;left:0;height:4px;background:var(--accent);z-index:2}

  .list-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}

  .checkbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .checkbox.done{background:var(--accent);border-color:var(--accent);color:#0b0f0d;font-weight:800}
  .done-text{text-decoration:line-through;color:var(--muted)}

  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:9px;cursor:pointer}
  .seg button.active{background:var(--accent);color:#0b0f0d}

  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;flex:1}
  .stat .n{font-size:22px;font-weight:800}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px}

  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
  .badge.warn{background:rgba(255,196,0,.15);color:#ffcf4a}
  .badge.ok{background:rgba(124,245,196,.15);color:var(--accent-2)}
  .badge.pt{background:rgba(199,255,63,.15);color:var(--accent)}

  /* Bottom tab bar */
  .tabbar{
    flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;
    padding:10px 14px 24px;background:rgba(11,15,13,.85);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);position:relative;z-index:30;
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;flex:1;transition:.15s}
  .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
  .tab.active{color:var(--accent)}

  /* progress ring (same language as the nutrition card) */
  .ring{border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--accent) 0 var(--p,0%),var(--surface-3) var(--p,0%) 100%)}
  .ring .inner{border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}

  /* Header inside app */
  .apphead{display:flex;align-items:center;gap:12px;padding:6px 0 2px}
  .icon-btn{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}

  /* OTP */
  .otp{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
  .otp input{width:100%;aspect-ratio:1;text-align:center;font-size:24px;font-weight:700;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);outline:none}
  .otp input:focus{border-color:var(--accent)}

  /* role picker */
  .role-card{flex:1;padding:16px;border-radius:15px;border:1px solid var(--line);background:var(--surface-2);text-align:center;cursor:pointer;transition:.15s}
  .role-card.active{border-color:var(--accent);background:rgba(199,255,63,.08)}
  .role-card .emoji{font-size:26px}
  .role-card .role-ico{width:30px;height:30px;stroke:var(--text);fill:none;stroke-width:1.8;display:block;margin:0 auto}
  .role-card.active .role-ico{stroke:var(--accent)}
  .role-card .t{font-weight:700;margin-top:8px;font-size:14px}
  .role-card .d{font-size:11px;color:var(--muted);margin-top:2px}

  /* toast */
  .toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#eef4ef;color:#0b0f0d;padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* modal sheet */
  .sheet-wrap{position:absolute;inset:0;z-index:70;display:none}
  .sheet-wrap.open{display:block}
  .sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px 30px;transform:translateY(100%);transition:.32s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto}
  .sheet-wrap.open .sheet{transform:none}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}

  .divider{height:1px;background:var(--line);margin:16px 0}
  .kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}

  .day{flex:0 0 auto;width:52px;text-align:center;padding:10px 0;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
  .day.active{background:var(--accent);color:#0b0f0d;border-color:var(--accent)}
  .day .dn{font-size:11px;font-weight:600;opacity:.7}
  .day .dd{font-size:17px;font-weight:800;margin-top:2px}
  .slot{padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;margin-top:10px;cursor:pointer;transition:.15s}
  .slot.taken{opacity:.4;text-decoration:line-through;cursor:not-allowed}
  .slot.sel{border-color:var(--accent);background:rgba(199,255,63,.08)}

  .fab{position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#0b0f0d;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 12px 24px rgba(199,255,63,.3);cursor:pointer;z-index:20}

  .hidden{display:none!important}

  .search-in{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:0 14px}
  .search-in input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;padding:14px 0}
  .search-in svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

  .meal-ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) 0 62%,var(--surface-3) 62% 100%);display:flex;align-items:center;justify-content:center;margin:0 auto}
  .meal-ring .inner{width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}

  /* ===== Real phone: fill the screen edge-to-edge like an installed app ===== */
  @media (max-width:500px){
    body{padding:0;display:block;background:#000;min-height:100dvh}
    .stage{gap:0;width:100%}
    .stage-title{display:none}
    .device{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    .device::before{display:none}
    .btn-side{display:none}
    .bezel{border-radius:0}
    .viewport{border-radius:0}
    .home-indicator{display:none}
  }
  /* If the phone is tall enough to show the full mockup, keep the pretty frame but shrink to fit width */
  @media (max-width:500px) and (min-height:980px){
    .device{width:min(100vw,440px);height:952px;margin:0 auto;border-radius:66px;padding:5px;box-shadow:0 20px 60px -20px rgba(0,0,0,.85)}
    .device::before{display:block}
    .bezel,.viewport{border-radius:61px}
    .home-indicator{display:block}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-title">
    <h1>Firon Performance — Personal Training</h1>
    <p>Interactive prototype · iPhone 17 Pro Max</p>
    <span class="pill">Core scope · optional features removed</span>
  </div>

  <div class="device">
    <div class="btn-side action"></div>
    <div class="btn-side vol-up"></div>
    <div class="btn-side vol-dn"></div>
    <div class="btn-side power"></div>
    <div class="bezel">
      <div class="viewport" id="viewport">
        <div class="island"><div class="cam"></div></div>

        <div class="statusbar">
          <span id="clock">9:41</span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="9" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.5c2.3 0 4.4.9 6 2.4l1.3-1.4C13.9 1.6 11.3.5 8.5.5S3.1 1.6 1.2 3.5L2.5 4.9C4.1 3.4 6.2 2.5 8.5 2.5z" fill="#fff"/><path d="M8.5 6c1.2 0 2.3.5 3.1 1.3l1.3-1.4C11.8 4.7 10.2 4 8.5 4S5.2 4.7 4.1 5.9l1.3 1.4C6.2 6.5 7.3 6 8.5 6z" fill="#fff"/><circle cx="8.5" cy="10" r="1.6" fill="#fff"/></svg>
            <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#fff"/><rect x="23" y="4" width="2" height="5" rx="1" fill="#fff" opacity=".5"/></svg>
          </span>
        </div>

        <div class="app">
          <div class="screens" id="screens">
            <!-- screens injected by JS -->
          </div>

          <!-- Bottom tab bar (client) -->
          <div class="tabbar hidden" id="tabbar-client">
            <div class="tab active" data-goto="home" data-tab>
              <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span>
            </div>
            <div class="tab" data-goto="workouts" data-tab>
              <svg viewBox="0 0 24 24"><path d="M4 8v8M8 6v12M16 6v12M20 8v8"/><path d="M8 12h8"/></svg><span>Train</span>
            </div>
            <div class="tab" data-goto="videos" data-tab>
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg><span>Videos</span>
            </div>
            <div class="tab" data-goto="profile" data-tab>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span>
            </div>
          </div>

          <!-- Bottom tab bar (PT) -->
          <div class="tabbar hidden" id="tabbar-pt">
            <div class="tab active" data-goto="pt-roster" data-tab>
              <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M15 20c0-2.5 2-3.5 4-3.5"/></svg><span>Clients</span>
            </div>
            <div class="tab" data-goto="pt-builder" data-tab>
              <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.2"/></svg><span>Plans</span>
            </div>
            <div class="tab" data-goto="pt-uploads" data-tab>
              <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg><span>Uploads</span>
            </div>
            <div class="tab" data-goto="pt-profile" data-tab>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span>
            </div>
          </div>

          <div class="toast" id="toast"></div>

          <!-- generic bottom sheet -->
          <div class="sheet-wrap" id="sheet">
            <div class="sheet-back" data-close-sheet></div>
            <div class="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
          </div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Firon Performance prototype — core (non-optional) feature set only
   ========================================================= */
const screensEl = document.getElementById('screens');
const viewport = document.getElementById('viewport');
let currentRole = 'client';
let ptClient = 0;   /* client index the trainer is currently editing */
let builderKind = 'train';   /* 'train' | 'diet' — which plan the builder is showing */
let onboardMode = 'signup';  /* 'signup' after registering | 'edit' from the profile tab */
let pendingOnboard = false;  /* OTP came from a new registration, not a password reset */

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- bottom sheet ---------- */
function openSheet(html){
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');}
document.querySelectorAll('[data-close-sheet]').forEach(e=>e.addEventListener('click',closeSheet));

/* ---------- navigation ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('scr-'+id);
  if(el){el.classList.add('active');el.scrollTop=0;}
  // sync tabbars
  document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t.dataset.goto===id));
  const showClientTabs=['home','workouts','videos','profile'].includes(id);
  const showPtTabs=['pt-roster','pt-builder','pt-uploads','pt-profile'].includes(id);
  document.getElementById('tabbar-client').classList.toggle('hidden',!showClientTabs);
  document.getElementById('tabbar-pt').classList.toggle('hidden',!showPtTabs);
}

/* suggested videos: what the client hasn't started yet, with a reason */
function suggested(){
  const why=v=>
    v.cat==='Strength'?'Matches your Lower Body plan':
    v.cat==='Core'?'Coach Sara added this for you':
    v.cat==='Mobility'||v.cat==='Yoga'?'Good recovery after today':
    'Popular with clients this week';
  const all=videos.map((v,i)=>({v,i}));
  const fresh=all.filter(o=>!o.v.prog);
  return (fresh.length?fresh:all).slice(0,3).map(o=>({...o,why:why(o.v)}));
}

function videoSheet(i){
  const v=videos[i];
  openSheet(`<h2 style="font-size:20px;font-weight:800">${v.t}</h2>
  <p class="sub mt8">${v.cat} · ${v.dur}${v.prog>0?` · ${Math.round(v.prog*100)}% watched`:''}</p>
  <div class="thumb mt16" style="height:190px;background:${grads[i%grads.length]}">
    <div class="grad" style="background:linear-gradient(to top,rgba(0,0,0,.55),transparent 60%)"></div>
    <div class="play"><span>▶</span></div>
    <div class="dur">${v.dur}</div>
    ${v.prog>0?`<div class="progressbar" style="width:${Math.round(v.prog*100)}%"></div>`:''}
  </div>
  <p class="sub mt16">Coach-approved session from your library. Follow along at your own pace — it counts toward your weekly target.</p>
  <button class="btn mt20" onclick="startVideo(${i})">${v.prog>0?'Resume video':'Start video'}</button>
  <button class="btn ghost mt12" onclick="toggleFavFromSheet(${i})">${v.fav?'♥ Remove from favorites':'♡ Save to favorites'}</button>`);
}
function startVideo(i){
  const v=videos[i];
  if(!v.prog)v.prog=0.05;
  closeSheet();rebuild('home');rebuild('videos');
  toast((v.prog>0.05?'Resuming ':'Playing ')+v.t);
}
function toggleFavFromSheet(i){
  videos[i].fav=!videos[i].fav;
  closeSheet();rebuild('videos');
  toast(videos[i].fav?'Added to favorites':'Removed from favorites');
}

function thumb(v,i,h=150){
  return `<div class="thumb" style="height:${h}px;background:${grads[i%grads.length]}">
    <div class="grad" style="background:linear-gradient(to top,rgba(0,0,0,.55),transparent 60%)"></div>
    <div class="fav" data-fav="${i}">${v.fav?'♥':'♡'}</div>
    <div class="play"><span>▶</span></div>
    <div class="dur">${v.dur}</div>
    ${v.prog>0?`<div class="progressbar" style="width:${Math.round(v.prog*100)}%"></div>`:''}
    <div style="position:relative;z-index:2;padding:10px 12px">
      <div style="font-size:10px;opacity:.85;font-weight:600">${v.cat}</div>
      <div style="font-size:14px;font-weight:700">${v.t}</div>
    </div>
  </div>`;
}

/* =========================================================
   BUILD screens into DOM
   ========================================================= */
Object.keys(SCREENS).forEach(id=>{
  const div=document.createElement('div');
  div.className='screen';div.id='scr-'+id;div.innerHTML=SCREENS[id]();
  screensEl.appendChild(div);
});
function rebuild(id){document.getElementById('scr-'+id).innerHTML=SCREENS[id]();}

/* =========================================================
   INTERACTIONS
   ========================================================= */
/* role picker on login */
screensEl.addEventListener('click',e=>{
  const rc=e.target.closest('[data-role]');
  if(rc){document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));rc.classList.add('active');currentRole=rc.dataset.role;}
  const otpM=e.target.closest('[data-otp-method]');
  if(otpM){otpM.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));otpM.classList.add('active');}
});

/* tab bar */
document.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>show(t.dataset.goto)));

/* --- validation helpers --- */
const isEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const isPhone=v=>/^[+]?[\d\s()-]{7,}$/.test(v);
function setErr(id,show){const i=document.getElementById(id);const e=document.getElementById(id+'-err');if(i)i.classList.toggle('err',show);if(e)e.classList.toggle('show',show);}

function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  let ok=true;
  if(!(isEmail(u)||isPhone(u))){setErr('li-user',true);ok=false;}else setErr('li-user',false);
  if(p.length<6){setErr('li-pass',true);ok=false;}else setErr('li-pass',false);
  if(!ok)return;
  enterApp();
}
function doRegister(){
  let ok=true;
  const name=document.getElementById('rg-name').value.trim();
  const email=document.getElementById('rg-email').value.trim();
  const phone=document.getElementById('rg-phone').value.trim();
  const pass=document.getElementById('rg-pass').value;
  setErr('rg-name',!name);if(!name)ok=false;
  setErr('rg-email',!isEmail(email));if(!isEmail(email))ok=false;
  setErr('rg-phone',!isPhone(phone));if(!isPhone(phone))ok=false;
  setErr('rg-pass',pass.length<6);if(pass.length<6)ok=false;
  if(!ok)return;
  me.name=name;me.email=email;me.phone=phone;
  pendingOnboard=true;
  document.getElementById('otp-dest')&&(document.getElementById('otp-dest').textContent=email);
  rebuild('otp');
  document.getElementById('scr-otp').querySelector('#otp-dest').textContent=email;
  show('otp');initOtp();
}
function doForgot(){
  const u=document.getElementById('fg-user').value.trim();
  if(!(isEmail(u)||isPhone(u))){setErr('fg-user',true);return;}
  setErr('fg-user',false);
  pendingOnboard=false;
  rebuild('otp');
  document.getElementById('scr-otp').querySelector('#otp-dest').textContent=u;
  show('otp');initOtp();
}
function initOtp(){
  const inputs=[...document.querySelectorAll('#scr-otp .otp input')];
  inputs.forEach((inp,i)=>{
    inp.value='';
    inp.oninput=()=>{if(inp.value&&inputs[i+1])inputs[i+1].focus();};
    inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&inputs[i-1])inputs[i-1].focus();};
  });
  inputs[0]&&inputs[0].focus();
}
function doVerifyOtp(){
  const code=[...document.querySelectorAll('#scr-otp .otp input')].map(i=>i.value).join('');
  if(code!=='1234'){toast('Invalid code — try 1234');return;}
  if(pendingOnboard&&currentRole!=='pt'){
    pendingOnboard=false;onboardMode='signup';rebuild('onboard');show('onboard');
    document.querySelectorAll('.tabbar').forEach(t=>t.classList.add('hidden'));
    toast('Account verified ✓');return;
  }
  pendingOnboard=false;enterApp();
}

/* onboarding / my details */
function pickSeg(el){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function pickChip(el){el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');}
function editMyDetails(){onboardMode='edit';rebuild('onboard');show('onboard');}
function saveMyDetails(){
  const val=id=>document.getElementById(id).value.trim();
  const h=parseFloat(val('ob-height')),w=parseFloat(val('ob-weight'));
  const bad=!(h>=100&&h<=250)||!(w>=30&&w<=300);
  document.getElementById('ob-body-err').classList.toggle('show',bad);
  document.getElementById('ob-height').classList.toggle('err',!(h>=100&&h<=250));
  document.getElementById('ob-weight').classList.toggle('err',!(w>=30&&w<=300));
  if(bad)return;
  const active=(sel,tag)=>{const el=document.querySelector(sel+' '+tag+'.active');return el?el.textContent.trim():null;};
  me.height=h;me.weight=w;
  me.age=parseInt(val('ob-age'),10)||me.age;
  me.bodyfat=parseFloat(val('ob-bf'))||null;
  me.waist=parseFloat(val('ob-waist'))||null;
  me.target=parseFloat(val('ob-target'))||null;
  me.gender=active('#ob-gender','button')||me.gender;
  me.sessions=parseInt(active('#ob-sessions','button'),10)||me.sessions;
  me.goal=active('#ob-goal','.chip')||me.goal;
  me.level=active('#ob-level','.chip')||me.level;
  rebuild('profile');rebuild('home');
  if(onboardMode==='edit'){show('profile');toast('Details updated ✓');}
  else{onboardMode='edit';enterApp();toast('Profile set up — welcome '+me.name.split(' ')[0]+' 👋');}
}

function enterApp(){

function daySheet(i){

/* videos: category filter */
screensEl.addEventListener('click',e=>{
  const cc=e.target.closest('#vid-cats .chip');
  if(cc){
    document.querySelectorAll('#vid-cats .chip').forEach(x=>x.classList.remove('active'));cc.classList.add('active');
    const cat=cc.dataset.cat;
    let list=videos.map((v,i)=>({v,i}));
    if(cat==='fav')list=list.filter(o=>o.v.fav);
    else if(cat!=='All')list=list.filter(o=>o.v.cat===cat);
    document.getElementById('vid-grid').innerHTML=list.length?list.map(o=>thumb(o.v,o.i)).join(''):'<p class="sub" style="grid-column:1/3;text-align:center;padding:30px">No videos in this category</p>';

/* global search */
function runSearch(q){
  q=q.trim().toLowerCase();
  const box=document.getElementById('search-results');
  if(!q){box.innerHTML='<p class="sub" style="text-align:center;margin-top:40px">Start typing to search your library</p>';return;}
  const vids=videos.filter(v=>v.t.toLowerCase().includes(q)||v.cat.toLowerCase().includes(q));
  const plans=[{t:'Lower Body Strength',s:'Workout plan'},{t:'Cutting Plan',s:'Nutrition plan'},{t:'Push & Core',s:'Workout plan'}].filter(p=>p.t.toLowerCase().includes(q)||p.s.toLowerCase().includes(q));
  let html='';
  if(plans.length){html+='<div class="sub" style="font-weight:700;margin-bottom:8px">Plans</div>';html+=plans.map(p=>`<div class="list-item"><div class="avatar" style="width:38px;height:38px;font-size:14px">📋</div><div class="grow"><div style="font-weight:600">${p.t}</div><div class="sub mt8">${p.s}</div></div></div>`).join('');}
  if(vids.length){html+='<div class="sub" style="font-weight:700;margin:14px 0 8px">Videos</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+vids.map(v=>thumb(v,videos.indexOf(v))).join('')+'</div>';}
  box.innerHTML=html||'<p class="sub" style="text-align:center;margin-top:40px">No results found</p>';
}

/* nutrition */
function toggleMeal(el){
  const done=el.classList.toggle('done');
  el.textContent=done?'✓':'';
  el.parentElement.querySelector('.grow>div').classList.toggle('done-text',done);
  const k=+el.dataset.k;
  const now=document.getElementById('kcal-now');
  let cur=parseInt(now.textContent.replace(/,/,''))||0;
  cur+=done?k:-k;now.textContent=cur.toLocaleString();
}

function saveLoggedExercise(){
  const name=document.getElementById('le-name').value.trim();
  if(!name){setErr('le-name',true);return;}
  setErr('le-name',false);
  const sets=document.getElementById('le-sets').value.trim();
  const reps=document.getElementById('le-reps').value.trim();
  const wt=document.getElementById('le-weight').value.trim();
  const note=document.getElementById('le-note').value.trim();
  const parts=[];
  if(sets&&reps)parts.push(sets+' × '+reps);

/* keep in-progress edits when the screen re-renders */
function syncBuilderFields(){
  const c=roster[ptClient];
  const val=id=>{const el=document.getElementById(id);return el?el.value:null;};
  if(builderKind==='diet'){
    const n=val('mp-name');if(n!==null)c.meal.name=n.trim();
    const num=(id,fb)=>{const v=parseInt(val(id),10);return v>0?v:fb;};
    c.meal.kcal=num('mp-kcal',c.meal.kcal);c.meal.p=num('mp-p',c.meal.p);
    c.meal.c=num('mp-c',c.meal.c);c.meal.f=num('mp-f',c.meal.f);
  }else{
    const pr=val('pb-prog');if(pr!==null&&pr.trim())c.plan=pr.trim();
  }
}
function setBuilderKind(k){if(builderKind===k)return;syncBuilderFields();builderKind=k;rebuild('pt-builder');}
function selectPlanClient(i){syncBuilderFields();ptClient=i;rebuild('pt-builder');}
function pickStart(el){el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');}

function saveClientMeal(i){
  const slot=document.getElementById('me-slot').value.trim();
  const food=document.getElementById('me-food').value.trim();
  const k=parseInt(document.getElementById('me-k').value,10);
  let ok=true;
  setErr('me-slot',!slot);if(!slot)ok=false;
  setErr('me-food',!food);if(!food)ok=false;
  setErr('me-k',!(k>0));if(!(k>0))ok=false;
  if(!ok)return;
  const list=roster[ptClient].meal.meals;
  if(i>=0)list[i]={m:slot,f:food,k:k};else list.push({m:slot,f:food,k:k});

function removeClientMeal(i){

function availabilitySummary(){
  const a=coach.availability,key=d=>d.off?'off':d.from+'-'+d.to,parts=[];
  let i=0;
  while(i<a.length){
    let j=i;
    while(j+1<a.length&&key(a[j+1])===key(a[i]))j++;
    parts.push((i===j?a[i].d:a[i].d+'–'+a[j].d)+' · '+(a[i].off?'Off':a[i].from+' – '+a[i].to));
    i=j+1;
  }

}

function editAvailability(){

function renderAvailabilityEditor(){
  openSheet(`<h2 style="font-size:20px;font-weight:800">Edit availability</h2>

    <div class="chip" onclick="closeWeekend()">Weekend off</div>

  <button class="btn ghost mt12" onclick="availabilitySheet()">Cancel</button>`);

/* keep typed times in the draft when the editor re-renders */
function readAvailability(){
  avDraft.forEach((d,i)=>{
    const f=document.getElementById('av-from-'+i),t=document.getElementById('av-to-'+i);
    if(f&&f.value)d.from=f.value;
    if(t&&t.value)d.to=t.value;
  });
}
function toggleDayOff(i){readAvailability();avDraft[i].off=!avDraft[i].off;renderAvailabilityEditor();}
function applyToWeekdays(){
  readAvailability();
  const m=avDraft[0];
  avDraft.slice(1,5).forEach(d=>{d.from=m.from;d.to=m.to;d.off=m.off;});
  renderAvailabilityEditor();toast('Mon hours copied to Tue–Fri');
}
function closeWeekend(){
  readAvailability();
  avDraft[5].off=true;avDraft[6].off=true;
  renderAvailabilityEditor();toast('Weekend set to off');
}
function saveAvailability(){
  readAvailability();
  const bad=avDraft.some(d=>!d.off&&d.from>=d.to);
  document.getElementById('av-err').classList.toggle('show',bad);
  if(bad)return;
  coach.availability=avDraft.map(d=>({...d}));avDraft=null;
  closeSheet();rebuild('pt-profile');
  const open=coach.availability.filter(d=>!d.off).length;
  toast('Availability saved · '+open+' day'+(open===1?'':'s')+' open ✓');
}

  const a=coach.availability,key=d=>d.off?'off':d.from+'-'+d.to,parts=[];

setInterval(tick,10000);
